<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 650" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="510" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Figure 14: Confusion Matrices for Gradient Boosting across Scenarios S0, S1, S2</text>
  <text x="510" y="58" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Reserved Validation Set (N = 4,889 | At-Risk = 2,581, Successful = 2,308)</text>

  <!-- Panel 1: S0 -->
  <g transform="translate(60, 110)">
    <text x="120" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Scenario S0: Baseline (Intake)</text>
    <text x="120" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#475569">Acc: 59.71% | Risk Recall: 65.67%</text>
    
    <text x="90" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">Pred: Succ</text>
    <text x="170" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">Pred: Risk</text>
    <text x="35" y="105" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">Act: Succ</text>
    <text x="35" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">Act: Risk</text>
    
    <rect x="50" y="65" width="80" height="80" fill="#e2e8f0" stroke="#cbd5e1" rx="4"/>
    <text x="90" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">1,224</text>
    <text x="90" y="125" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#64748b">TN (53.0%)</text>
    
    <rect x="130" y="65" width="80" height="80" fill="#fee2e2" stroke="#fca5a5" rx="4"/>
    <text x="170" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">1,084</text>
    <text x="170" y="125" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#b91c1c">FP (47.0%)</text>
    
    <rect x="50" y="145" width="80" height="80" fill="#fef3c7" stroke="#fcd34d" rx="4"/>
    <text x="90" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">886</text>
    <text x="90" y="205" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#b45309">FN (34.3%)</text>
    
    <rect x="130" y="145" width="80" height="80" fill="#dcfce7" stroke="#86efac" rx="4"/>
    <text x="170" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#166534">1,695</text>
    <text x="170" y="205" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#15803d">TP (65.7%)</text>
    
    <text x="120" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#64748b">Baseline: 886 False Negatives</text>
  </g>

  <!-- Panel 2: S1 -->
  <g transform="translate(390, 110)">
    <text x="120" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Scenario S1: Early Academic (Day 30)</text>
    <text x="120" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#475569">Acc: 70.12% | Risk Recall: 74.82%</text>
    
    <text x="90" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">Pred: Succ</text>
    <text x="170" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">Pred: Risk</text>
    <text x="35" y="105" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">Act: Succ</text>
    <text x="35" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">Act: Risk</text>
    
    <rect x="50" y="65" width="80" height="80" fill="#e2e8f0" stroke="#cbd5e1" rx="4"/>
    <text x="90" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">1,497</text>
    <text x="90" y="125" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#64748b">TN (64.9%)</text>
    
    <rect x="130" y="65" width="80" height="80" fill="#fee2e2" stroke="#fca5a5" rx="4"/>
    <text x="170" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">811</text>
    <text x="170" y="125" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#b91c1c">FP (35.1%)</text>
    
    <rect x="50" y="145" width="80" height="80" fill="#fef3c7" stroke="#fcd34d" rx="4"/>
    <text x="90" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">650</text>
    <text x="90" y="205" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#b45309">FN (25.2%)</text>
    
    <rect x="130" y="145" width="80" height="80" fill="#dcfce7" stroke="#86efac" rx="4"/>
    <text x="170" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#166534">1,931</text>
    <text x="170" y="205" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#15803d">TP (74.8%)</text>
    
    <text x="120" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d97706">FN reduced by 236 (-26.6%)</text>
  </g>

  <!-- Panel 3: S2 -->
  <g transform="translate(720, 110)">
    <text x="120" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Scenario S2: Early Behavioral (Day 30)</text>
    <text x="120" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#475569">Acc: 76.44% | Risk Recall: 80.86%</text>
    
    <text x="90" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">Pred: Succ</text>
    <text x="170" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">Pred: Risk</text>
    <text x="35" y="105" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">Act: Succ</text>
    <text x="35" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">Act: Risk</text>
    
    <rect x="50" y="65" width="80" height="80" fill="#e2e8f0" stroke="#cbd5e1" rx="4"/>
    <text x="90" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">1,650</text>
    <text x="90" y="125" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#64748b">TN (71.5%)</text>
    
    <rect x="130" y="65" width="80" height="80" fill="#fee2e2" stroke="#fca5a5" rx="4"/>
    <text x="170" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">658</text>
    <text x="170" y="125" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#b91c1c">FP (28.5%)</text>
    
    <rect x="50" y="145" width="80" height="80" fill="#fef3c7" stroke="#fcd34d" rx="4"/>
    <text x="90" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">494</text>
    <text x="90" y="205" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#b45309">FN (19.1%)</text>
    
    <rect x="130" y="145" width="80" height="80" fill="#dcfce7" stroke="#86efac" rx="4"/>
    <text x="170" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#166534">2,087</text>
    <text x="170" y="205" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#15803d">TP (80.9%)</text>
    
    <text x="120" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">FN reduced by 392 (-44.2%) vs S0</text>
  </g>

  <!-- Summary Box -->
  <rect x="60" y="420" width="900" height="190" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Key Clinical/Operational Takeaway for Early Academic Support:</text>
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="13" fill="#334155">• In Scenario S0 (Intake only), 886 out of 2,581 at-risk students are missed (34.3% False Negative Rate).</text>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Incorporating early assessment grades (S1) reduces missed at-risk students to 650 (25.2% False Negative Rate).</text>
  <text x="80" y="540" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Integrating digital learning engagement clickstream (S2) drives False Negatives down to 494 (19.1% False Negative Rate).</text>
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">• Overall Progression: At-Risk Recall increases monotonically from 65.67% (S0) → 74.82% (S1) → 80.86% (S2) at threshold 0.50.</text>
</svg>
