<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="460" y="32" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f172a">Figure 13: Precision-Recall (PR) Curves for At-Risk Class Identification</text>
  <text x="460" y="54" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Baseline At-Risk Prevalence = 52.8% | Reserved Validation Set (N = 4,889)</text>

  <!-- Plot Area: x: 90 to 610, y: 520 to 90 -->
  <line x1="90" y1="520" x2="610" y2="520" stroke="#94a3b8" stroke-width="2"/>
  <line x1="90" y1="520" x2="90" y2="90" stroke="#94a3b8" stroke-width="2"/>

  <!-- Ticks & Grid -->
  <text x="90" y="540" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">0.0</text>
  <text x="75" y="524" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#64748b">0.0</text>

  <line x1="194" y1="520" x2="194" y2="90" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="90" y1="434" x2="610" y2="434" stroke="#f1f5f9" stroke-width="1"/>
  <text x="194" y="540" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">0.2</text>
  <text x="75" y="438" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#64748b">0.2</text>

  <line x1="298" y1="520" x2="298" y2="90" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="90" y1="348" x2="610" y2="348" stroke="#f1f5f9" stroke-width="1"/>
  <text x="298" y="540" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">0.4</text>
  <text x="75" y="352" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#64748b">0.4</text>

  <line x1="402" y1="520" x2="402" y2="90" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="90" y1="262" x2="610" y2="262" stroke="#f1f5f9" stroke-width="1"/>
  <text x="402" y="540" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">0.6</text>
  <text x="75" y="266" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#64748b">0.6</text>

  <line x1="506" y1="520" x2="506" y2="90" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="90" y1="176" x2="610" y2="176" stroke="#f1f5f9" stroke-width="1"/>
  <text x="506" y="540" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">0.8</text>
  <text x="75" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#64748b">0.8</text>

  <line x1="610" y1="520" x2="610" y2="90" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="90" y1="90" x2="610" y2="90" stroke="#f1f5f9" stroke-width="1"/>
  <text x="610" y="540" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">1.0</text>
  <text x="75" y="94" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#64748b">1.0</text>

  <!-- Baseline Prevalence Line: 52.8% -> y = 520 - 0.528 * 430 = 292.96 -->
  <line x1="90" y1="293" x2="610" y2="293" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="615" y="297" font-family="Arial, sans-serif" font-size="11" fill="#ef4444" font-weight="bold">Base: 52.8%</text>

  <!-- Axis Titles -->
  <text x="350" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">Recall (At-Risk Class)</text>
  <text x="35" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b" transform="rotate(-90 35 305)">Precision (At-Risk Class)</text>

  <!-- Curves -->
  <!-- S0 PR Curves (PR-AUC ~ 0.599 - 0.615) -->
  <path d="M 116.0 260.3 L 194.0 261.5 L 298.0 265.4 L 402.0 272.0 L 506.0 281.2 L 610.0 293.0" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 116.0 262.7 L 194.0 263.8 L 298.0 267.5 L 402.0 273.5 L 506.0 282.0 L 610.0 293.0" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 116.0 255.8 L 194.0 257.2 L 298.0 261.6 L 402.0 269.1 L 506.0 279.2 L 610.0 293.0" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <!-- S1 PR Curves (PR-AUC ~ 0.737 - 0.758) -->
  <path d="M 116.0 203.5 L 194.0 206.7 L 298.0 217.7 L 402.0 235.6 L 506.0 260.7 L 610.0 293.0" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 116.0 199.1 L 194.0 202.7 L 298.0 213.9 L 402.0 232.8 L 506.0 259.1 L 610.0 293.0" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 116.0 194.4 L 194.0 198.1 L 298.0 210.0 L 402.0 229.7 L 506.0 257.4 L 610.0 293.0" fill="none" stroke="#d97706" stroke-width="2.5"/>

  <!-- S2 PR Curves (PR-AUC ~ 0.822 - 0.848) -->
  <path d="M 116.0 166.8 L 194.0 171.7 L 298.0 186.8 L 402.0 212.0 L 506.0 247.5 L 610.0 293.0" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 116.0 160.5 L 194.0 165.6 L 298.0 181.4 L 402.0 208.0 L 506.0 245.1 L 610.0 293.0" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M 116.0 155.8 L 194.0 161.0 L 298.0 177.4 L 402.0 204.9 L 506.0 243.5 L 610.0 293.0" fill="none" stroke="#1d4ed8" stroke-width="3"/>

  <!-- Legend Box -->
  <rect x="640" y="90" width="260" height="430" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="655" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Precision-Recall Legend</text>

  <text x="655" y="142" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">S0: Baseline Intake</text>
  <line x1="655" y1="160" x2="685" y2="160" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="695" y="164" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">LogReg (PR-AUC = 0.604)</text>
  <line x1="655" y1="185" x2="685" y2="185" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="695" y="189" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">Random Forest (PR-AUC = 0.599)</text>
  <line x1="655" y1="210" x2="685" y2="210" stroke="#64748b" stroke-width="2.5"/>
  <text x="695" y="214" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">GradBoost (PR-AUC = 0.615)</text>

  <text x="655" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b45309">S1: Early Academic (Day 30)</text>
  <line x1="655" y1="265" x2="685" y2="265" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="695" y="269" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">LogReg (PR-AUC = 0.737)</text>
  <line x1="655" y1="290" x2="685" y2="290" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="695" y="294" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">Random Forest (PR-AUC = 0.747)</text>
  <line x1="655" y1="315" x2="685" y2="315" stroke="#d97706" stroke-width="2.5"/>
  <text x="695" y="319" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">GradBoost (PR-AUC = 0.758)</text>

  <text x="655" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">S2: Early Behavioral (Day 30)</text>
  <line x1="655" y1="370" x2="685" y2="370" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="695" y="374" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">LogReg (PR-AUC = 0.822)</text>
  <line x1="655" y1="395" x2="685" y2="395" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="695" y="399" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">Random Forest (PR-AUC = 0.837)</text>
  <line x1="655" y1="420" x2="685" y2="420" stroke="#1d4ed8" stroke-width="3"/>
  <text x="695" y="424" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">GradBoost (PR-AUC = 0.848)</text>

  <rect x="650" y="445" width="240" height="60" fill="#eff6ff" rx="4" stroke="#bfdbfe"/>
  <text x="655" y="465" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">Clinical Takeaway:</text>
  <text x="655" y="482" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af">At 80% Recall, Precision rises</text>
  <text x="655" y="497" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af">from 56.0% (S0) → 76.1% (S2).</text>
</svg>
