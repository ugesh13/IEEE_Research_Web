<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="460" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Figure 17: Final Test Set Confusion Matrices (Scenario S2 Gradient Boosting)</text>
<text x="460" y="58" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Locked Holdout Test Partition (N = 4,889 | At-Risk = 2,582, Successful = 2,307 | 4,318 Unique Students)</text>
<!-- Panel 1: Standard Threshold theta = 0.50 -->
<g transform="translate(100, 110)">
<text x="140" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e293b">Standard Threshold (θ = 0.50)</text>
<text x="140" y="22" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#475569">Accuracy: 76.19% | At-Risk Recall: 80.60%</text>
<text x="100" y="58" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">Pred: Succ (0)</text>
<text x="200" y="58" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">Pred: Risk (1)</text>
<text x="40" y="115" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">Act: Succ</text>
<text x="40" y="215" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">Act: Risk</text>
<!-- TN -->
<rect x="50" y="70" width="100" height="90" fill="#e2e8f0" stroke="#cbd5e1" rx="4"/>
<text x="100" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">1,644</text>
<text x="100" y="138" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">TN (71.26%)</text>
<!-- FP -->
<rect x="150" y="70" width="100" height="90" fill="#fee2e2" stroke="#fca5a5" rx="4"/>
<text x="200" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#991b1b">663</text>
<text x="200" y="138" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#b91c1c">FP (28.74%)</text>
<!-- FN -->
<rect x="50" y="160" width="100" height="90" fill="#fef3c7" stroke="#fcd34d" rx="4"/>
<text x="100" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">501</text>
<text x="100" y="228" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#b45309">FN (19.40%)</text>
<!-- TP -->
<rect x="150" y="160" width="100" height="90" fill="#dcfce7" stroke="#86efac" rx="4"/>
<text x="200" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#166534">2,081</text>
<text x="200" y="228" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#15803d">TP (80.60%)</text>
<text x="150" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#64748b">Missed Students: 501</text>
</g>
<!-- Panel 2: Operational Threshold theta* = 0.45 -->
<g transform="translate(540, 110)">
<text x="140" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e293b">Operational Early-Warning (θ* = 0.45)</text>
<text x="140" y="22" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#475569">Accuracy: 75.95% | At-Risk Recall: 82.38%</text>
<text x="100" y="58" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">Pred: Succ (0)</text>
<text x="200" y="58" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">Pred: Risk (1)</text>
<text x="40" y="115" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">Act: Succ</text>
<text x="40" y="215" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="end" fill="#64748b">Act: Risk</text>
<!-- TN -->
<rect x="50" y="70" width="100" height="90" fill="#e2e8f0" stroke="#cbd5e1" rx="4"/>
<text x="100" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">1,586</text>
<text x="100" y="138" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">TN (68.75%)</text>
<!-- FP -->
<rect x="150" y="70" width="100" height="90" fill="#fee2e2" stroke="#fca5a5" rx="4"/>
<text x="200" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#991b1b">721</text>
<text x="200" y="138" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#b91c1c">FP (31.25%)</text>
<!-- FN -->
<rect x="50" y="160" width="100" height="90" fill="#fef3c7" stroke="#fcd34d" rx="4"/>
<text x="100" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">455</text>
<text x="100" y="228" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#b45309">FN (17.62%)</text>
<!-- TP -->
<rect x="150" y="160" width="100" height="90" fill="#dcfce7" stroke="#86efac" rx="4"/>
<text x="200" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#166534">2,127</text>
<text x="200" y="228" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#15803d">TP (82.38%)</text>
<text x="150" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#16a34a">Missed Students: 455 (-46 missed)</text>
</g>
<!-- Comparison summary box below -->
<rect x="80" y="430" width="760" height="155" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
<text x="100" y="458" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Comparative Operational Summary for Institutional Advising:</text>
<text x="100" y="485" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">• Under baseline θ = 0.50, the model achieves 80.60% recall, identifying 2,081 of 2,582 at-risk test students.</text>
<text x="100" y="510" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">• Calibrated threshold θ* = 0.45 increases recall to 82.38%, capturing 46 additional at-risk students (total 2,127).</text>
<text x="100" y="535" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">• The trade-off is a minimal precision decrease from 75.84% → 74.68% (58 additional false positives across 4,889 students).</text>
<text x="100" y="560" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8">• For proactive early intervention, θ* = 0.45 minimizes student attrition risk while maintaining high precision.</text>
</svg>
