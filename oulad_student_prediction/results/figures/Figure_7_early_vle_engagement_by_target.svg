<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1e3a8a; text-anchor: middle; }
      .axis-label { font-family: Arial, sans-serif; font-size: 11.5px; font-weight: bold; fill: #374151; }
      .tick { font-family: Arial, sans-serif; font-size: 10.5px; fill: #4b5563; }
      .stat-val { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #111827; }
      .grid { stroke: #e5e7eb; stroke-dasharray: 3,3; }
    </style>
  </defs>
  <rect width="800" height="450" fill="#ffffff" />
  <text x="400" y="30" class="title">Figure 7: Early Digital Engagement Patterns by Academic Outcome Group</text>
  <text x="400" y="48" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle">(Prediction Cutoff: Day ≤ 30 | N = 32,593)</text>

  <!-- PANEL A: Total VLE Clicks -->
  <g transform="translate(40, 70)">
    <text x="160" y="15" class="sub-title">(a) Total Early Clicks (Day ≤ 30)</text>
    
    <!-- Y-axis -->
    <line x1="50" y1="40" x2="50" y2="300" stroke="#9ca3af" stroke-width="1.2" />
    <line x1="50" y1="300" x2="310" y2="300" stroke="#9ca3af" stroke-width="1.2" />

    <!-- Grid lines & Ticks (0 to 800 clicks, 260px span) -->
    <line x1="50" y1="235" x2="310" y2="235" class="grid" />
    <line x1="50" y1="170" x2="310" y2="170" class="grid" />
    <line x1="50" y1="105" x2="310" y2="105" class="grid" />
    <line x1="50" y1="40" x2="310" y2="40" class="grid" />

    <text x="42" y="304" class="tick" text-anchor="end">0</text>
    <text x="42" y="239" class="tick" text-anchor="end">200</text>
    <text x="42" y="174" class="tick" text-anchor="end">400</text>
    <text x="42" y="109" class="tick" text-anchor="end">600</text>
    <text x="42" y="44" class="tick" text-anchor="end">800</text>
    <text x="15" y="170" class="axis-label" transform="rotate(-90 15 170)" text-anchor="middle">Total VLE Clicks</text>

    <!-- Successful Group Box (Median = 245, Q1 = 82, Q3 = 560) -->
    <!-- Scale: 800 clicks = 260px -> 1 click = 0.325px. Y = 300 - val*0.325 -->
    <!-- Q1=82 -> y=273.3, Median=245 -> y=220.4, Q3=560 -> y=118.0 -->
    <line x1="115" y1="273" x2="115" y2="295" stroke="#1f77b4" stroke-width="1.5" />
    <line x1="115" y1="118" x2="115" y2="50" stroke="#1f77b4" stroke-width="1.5" />
    <rect x="80" y="118" width="70" height="155" rx="3" fill="#1f77b4" fill-opacity="0.3" stroke="#1f77b4" stroke-width="1.8" />
    <line x1="80" y1="220" x2="150" y2="220" stroke="#0f172a" stroke-width="2.5" />
    <text x="115" y="214" class="stat-val" text-anchor="middle">245</text>
    <text x="115" y="320" class="tick" font-weight="bold" text-anchor="middle">Successful (0)</text>

    <!-- At-Risk Group Box (Median = 84, Q1 = 12, Q3 = 242) -->
    <!-- Q1=12 -> y=296.1, Median=84 -> y=272.7, Q3=242 -> y=221.35 -->
    <line x1="245" y1="296" x2="245" y2="300" stroke="#d62728" stroke-width="1.5" />
    <line x1="245" y1="221" x2="245" y2="120" stroke="#d62728" stroke-width="1.5" />
    <rect x="210" y="221" width="70" height="75" rx="3" fill="#d62728" fill-opacity="0.3" stroke="#d62728" stroke-width="1.8" />
    <line x1="210" y1="273" x2="280" y2="273" stroke="#0f172a" stroke-width="2.5" />
    <text x="245" y="267" class="stat-val" text-anchor="middle">84</text>
    <text x="245" y="320" class="tick" font-weight="bold" text-anchor="middle">At-Risk (1)</text>
  </g>

  <!-- PANEL B: Active Learning Days -->
  <g transform="translate(440, 70)">
    <text x="160" y="15" class="sub-title">(b) Active Learning Days (Day ≤ 30)</text>

    <!-- Y-axis -->
    <line x1="50" y1="40" x2="50" y2="300" stroke="#9ca3af" stroke-width="1.2" />
    <line x1="50" y1="300" x2="310" y2="300" stroke="#9ca3af" stroke-width="1.2" />

    <!-- Grid lines & Ticks (0 to 30 days, 260px span -> 8.67px per day) -->
    <line x1="50" y1="235" x2="310" y2="235" class="grid" />
    <line x1="50" y1="170" x2="310" y2="170" class="grid" />
    <line x1="50" y1="105" x2="310" y2="105" class="grid" />
    <line x1="50" y1="40" x2="310" y2="40" class="grid" />

    <text x="42" y="304" class="tick" text-anchor="end">0</text>
    <text x="42" y="239" class="tick" text-anchor="end">7.5</text>
    <text x="42" y="174" class="tick" text-anchor="end">15</text>
    <text x="42" y="109" class="tick" text-anchor="end">22.5</text>
    <text x="42" y="44" class="tick" text-anchor="end">30</text>
    <text x="15" y="170" class="axis-label" transform="rotate(-90 15 170)" text-anchor="middle">Active Days (Logins)</text>

    <!-- Successful: Median = 11 days, Q1 = 5, Q3 = 18 -->
    <!-- y = 300 - days*8.67: Q1(5) -> 256.6, Med(11) -> 204.6, Q3(18) -> 143.9 -->
    <line x1="115" y1="257" x2="115" y2="290" stroke="#1f77b4" stroke-width="1.5" />
    <line x1="115" y1="144" x2="115" y2="60" stroke="#1f77b4" stroke-width="1.5" />
    <rect x="80" y="144" width="70" height="113" rx="3" fill="#1f77b4" fill-opacity="0.3" stroke="#1f77b4" stroke-width="1.8" />
    <line x1="80" y1="205" x2="150" y2="205" stroke="#0f172a" stroke-width="2.5" />
    <text x="115" y="198" class="stat-val" text-anchor="middle">11 days</text>
    <text x="115" y="320" class="tick" font-weight="bold" text-anchor="middle">Successful (0)</text>

    <!-- At-Risk: Median = 4 days, Q1 = 1, Q3 = 9 -->
    <!-- Q1(1) -> 291.3, Med(4) -> 265.3, Q3(9) -> 222.0 -->
    <line x1="245" y1="291" x2="245" y2="300" stroke="#d62728" stroke-width="1.5" />
    <line x1="245" y1="222" x2="245" y2="135" stroke="#d62728" stroke-width="1.5" />
    <rect x="210" y="222" width="70" height="69" rx="3" fill="#d62728" fill-opacity="0.3" stroke="#d62728" stroke-width="1.8" />
    <line x1="210" y1="265" x2="280" y2="265" stroke="#0f172a" stroke-width="2.5" />
    <text x="245" y="258" class="stat-val" text-anchor="middle">4 days</text>
    <text x="245" y="320" class="tick" font-weight="bold" text-anchor="middle">At-Risk (1)</text>
  </g>
</svg>
