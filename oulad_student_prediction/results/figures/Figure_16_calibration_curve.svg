<text x="660" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Calibration Diagnostics:</text>
<text x="660" y="305" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">• Method: Platt Sigmoid scaling</text>
<text x="660" y="325" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">• Fitted on Training Folds</text>
<text x="660" y="345" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">• Evaluated on Validation Set</text>
<text x="660" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Clinical Value:</text>
<text x="660" y="395" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">Sigmoidal calibration prevents</text>
<text x="660" y="412" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">histogram binning artifacts at the</text>
<text x="660" y="429" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">probability extremes, ensuring</text>
<text x="660" y="446" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">that an estimated 80% risk</text>
<text x="660" y="463" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">closely matches 80% empirical failure.</text>
