<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: Arial, sans-serif; font-size: 11px; fill: #6b7280; text-anchor: middle; }
      .scenario-name { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1f2937; text-anchor: end; }
      .bar-count { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .total-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #111827; }
      .legend-text { font-family: Arial, sans-serif; font-size: 10.5px; fill: #374151; }
      .tick { font-family: Arial, sans-serif; font-size: 10px; fill: #6b7280; }
    </style>
  </defs>
  <rect width="800" height="420" fill="#ffffff" />
  <text x="400" y="32" class="title">Figure 11: Nested Feature Availability Progression Horizon Across Scenarios</text>
  <text x="400" y="50" class="sub-title">Systematic operationalization of RQ2 (Evaluating incremental predictive value: S0 → S1 → S2)</text>

  <!-- Legend -->
  <rect x="70" y="72" width="16" height="12" fill="#64748b" />
  <text x="92" y="82" class="legend-text">Demographics &amp; Registration Metadata (Day ≤ 0)</text>
  <rect x="360" y="72" width="16" height="12" fill="#1f77b4" />
  <text x="382" y="82" class="legend-text">Early Assessment Graded Performance (Day ≤ 30)</text>
  <rect x="635" y="72" width="16" height="12" fill="#059669" />
  <text x="657" y="82" class="legend-text">VLE Digital Clickstream (Day ≤ 30)</text>

  <!-- Axes & Grid -->
  <line x1="170" y1="110" x2="170" y2="330" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="170" y1="330" x2="720" y2="330" stroke="#9ca3af" stroke-width="1.2" />

  <!-- Ticks: 0 to 35 features, span: 525px -> 15px per feature -->
  <line x1="170" y1="330" x2="170" y2="335" stroke="#9ca3af" />
  <text x="170" y="350" class="tick" text-anchor="middle">0</text>
  <line x1="245" y1="330" x2="245" y2="335" stroke="#9ca3af" />
  <text x="245" y="350" class="tick" text-anchor="middle">5</text>
  <line x1="320" y1="330" x2="320" y2="335" stroke="#9ca3af" />
  <text x="320" y="350" class="tick" text-anchor="middle">10</text>
  <line x1="395" y1="330" x2="395" y2="335" stroke="#9ca3af" />
  <text x="395" y="350" class="tick" text-anchor="middle">15</text>
  <line x1="470" y1="330" x2="470" y2="335" stroke="#9ca3af" />
  <text x="470" y="350" class="tick" text-anchor="middle">20</text>
  <line x1="545" y1="330" x2="545" y2="335" stroke="#9ca3af" />
  <text x="545" y="350" class="tick" text-anchor="middle">25</text>
  <line x1="620" y1="330" x2="620" y2="335" stroke="#9ca3af" />
  <text x="620" y="350" class="tick" text-anchor="middle">30</text>
  <line x1="695" y1="330" x2="695" y2="335" stroke="#9ca3af" />
  <text x="695" y="350" class="tick" text-anchor="middle">35</text>
  <text x="445" y="380" font-family="Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#374151" text-anchor="middle">Number of Engineered Predictive Features</text>

  <!-- S0 Bar (13 features -> 13*15 = 195px) -->
  <text x="155" y="155" class="scenario-name">S0 (Baseline)</text>
  <text x="155" y="170" font-family="Arial, sans-serif" font-size="9.5px" fill="#6b7280" text-anchor="end">Day ≤ 0</text>
  <rect x="170" y="140" width="195" height="35" rx="3" fill="#64748b" />
  <text x="267" y="162" class="bar-count">13 Baseline</text>
  <text x="375" y="162" class="total-label">13 Features</text>

  <!-- S1 Bar (13 Base + 8 Asm = 21 features -> 315px) -->
  <text x="155" y="225" class="scenario-name">S1 (Early Academic)</text>
  <text x="155" y="240" font-family="Arial, sans-serif" font-size="9.5px" fill="#6b7280" text-anchor="end">Day ≤ 30</text>
  <rect x="170" y="210" width="195" height="35" rx="3" fill="#64748b" />
  <text x="267" y="232" class="bar-count">13 Base</text>
  <rect x="365" y="210" width="120" height="35" rx="3" fill="#1f77b4" />
  <text x="425" y="232" class="bar-count">+8 Asm</text>
  <text x="495" y="232" class="total-label">21 Features</text>

  <!-- S2 Bar (13 Base + 8 Asm + 8 VLE = 29 features -> 435px) -->
  <text x="155" y="295" class="scenario-name">S2 (Early Behavioral)</text>
  <text x="155" y="310" font-family="Arial, sans-serif" font-size="9.5px" fill="#6b7280" text-anchor="end">Day ≤ 30</text>
  <rect x="170" y="280" width="195" height="35" rx="3" fill="#64748b" />
  <text x="267" y="302" class="bar-count">13 Base</text>
  <rect x="365" y="280" width="120" height="35" rx="3" fill="#1f77b4" />
  <text x="425" y="302" class="bar-count">+8 Asm</text>
  <rect x="485" y="280" width="120" height="35" rx="3" fill="#059669" />
  <text x="545" y="302" class="bar-count">+8 VLE</text>
  <text x="615" y="302" class="total-label">29 Features</text>
</svg>
