<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .axis-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #374151; }
      .bar-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .tick { font-family: Arial, sans-serif; font-size: 11px; fill: #4b5563; }
      .grid { stroke: #e5e7eb; stroke-dasharray: 3,3; }
    </style>
  </defs>
  <rect width="600" height="450" fill="#ffffff" />
  <text x="300" y="32" class="title">Figure 3: Primary Binary Target Distribution in OULAD</text>
  <text x="300" y="50" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle">(N = 32,593 Student-Course Enrollments)</text>

  <!-- Grid lines -->
  <line x1="90" y1="360" x2="540" y2="360" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="90" y1="290" x2="540" y2="290" class="grid" />
  <line x1="90" y1="220" x2="540" y2="220" class="grid" />
  <line x1="90" y1="150" x2="540" y2="150" class="grid" />
  <line x1="90" y1="80" x2="540" y2="80" class="grid" />

  <!-- Y Ticks -->
  <text x="80" y="364" class="tick" text-anchor="end">0</text>
  <text x="80" y="294" class="tick" text-anchor="end">5,000</text>
  <text x="80" y="224" class="tick" text-anchor="end">10,000</text>
  <text x="80" y="154" class="tick" text-anchor="end">15,000</text>
  <text x="80" y="84" class="tick" text-anchor="end">20,000</text>
  <text x="25" y="220" class="axis-label" transform="rotate(-90 25 220)" text-anchor="middle">Number of Student Presentations</text>

  <!-- Bars -->
  <!-- Successful: 15,385 (height: 15385/20000 * 280 = 215.4px -> y = 360 - 215.4 = 144.6) -->
  <rect x="150" y="145" width="130" height="215" rx="4" fill="#1f77b4" stroke="#0f172a" stroke-width="1" />
  <text x="215" y="125" class="bar-label">15,385</text>
  <text x="215" y="140" font-family="Arial, sans-serif" font-size="11px" font-weight="bold" fill="#1f77b4" text-anchor="middle">(47.20%)</text>
  <text x="215" y="380" class="tick" font-weight="bold" text-anchor="middle">Successful (0)</text>
  <text x="215" y="396" font-family="Arial, sans-serif" font-size="10px" fill="#6b7280" text-anchor="middle">(Pass + Distinction)</text>

  <!-- At-Risk: 17,208 (height: 17208/20000 * 280 = 240.9px -> y = 360 - 240.9 = 119.1) -->
  <rect x="350" y="119" width="130" height="241" rx="4" fill="#d62728" stroke="#0f172a" stroke-width="1" />
  <text x="415" y="99" class="bar-label">17,208</text>
  <text x="415" y="114" font-family="Arial, sans-serif" font-size="11px" font-weight="bold" fill="#d62728" text-anchor="middle">(52.80%)</text>
  <text x="415" y="380" class="tick" font-weight="bold" text-anchor="middle">At-Risk (1)</text>
  <text x="415" y="396" font-family="Arial, sans-serif" font-size="10px" fill="#6b7280" text-anchor="middle">(Fail + Withdrawn)</text>
</svg>
