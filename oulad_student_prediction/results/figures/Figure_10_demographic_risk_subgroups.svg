<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: Arial, sans-serif; font-size: 12.5px; font-weight: bold; fill: #1e3a8a; }
      .axis-label { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #374151; }
      .tick { font-family: Arial, sans-serif; font-size: 10px; fill: #4b5563; }
      .bar-text { font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #111827; }
      .ref-line { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4,3; }
    </style>
  </defs>
  <rect width="900" height="680" fill="#ffffff" />
  <text x="450" y="30" class="title">Figure 10: Academic Risk Proportions Across Demographic Subgroups</text>
  <text x="450" y="48" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle">(N = 32,593 | Cohort Baseline Risk = 52.80%)</text>

  <!-- PANEL A: Highest Education (Top Left) -->
  <g transform="translate(40, 70)">
    <text x="0" y="15" class="sub-title">(a) Prior Educational Attainment</text>
    <!-- Scale: 0 to 70%, span: 260px -> 3.71px per 1% -->
    <line x1="150" y1="35" x2="410" y2="35" stroke="#9ca3af" />
    <line x1="150" y1="35" x2="150" y2="240" stroke="#9ca3af" />
    
    <!-- Cohort Ref line at 52.8% -> x = 150 + 52.8*3.71 = 345.9 -->
    <line x1="346" y1="35" x2="346" y2="240" class="ref-line" />
    <text x="348" y="252" font-family="Arial, sans-serif" font-size="9px" fill="#dc2626" font-weight="bold">Baseline: 52.8%</text>

    <!-- Bars -->
    <!-- No Formal: 63.1% -> 234px -->
    <text x="140" y="60" class="tick" text-anchor="end">No Formal quals</text>
    <rect x="150" y="46" width="234" height="20" rx="3" fill="#1f77b4" />
    <text x="390" y="60" class="bar-text">63.1%</text>

    <!-- Lower Than A Level: 59.4% -> 220px -->
    <text x="140" y="100" class="tick" text-anchor="end">Lower Than A Level</text>
    <rect x="150" y="86" width="220" height="20" rx="3" fill="#1f77b4" />
    <text x="376" y="100" class="bar-text">59.4%</text>

    <!-- A Level: 51.0% -> 189px -->
    <text x="140" y="140" class="tick" text-anchor="end">A Level / Equiv</text>
    <rect x="150" y="126" width="189" height="20" rx="3" fill="#1f77b4" />
    <text x="345" y="140" class="bar-text">51.0%</text>

    <!-- HE Qual: 40.0% -> 148px -->
    <text x="140" y="180" class="tick" text-anchor="end">HE Qualification</text>
    <rect x="150" y="166" width="148" height="20" rx="3" fill="#1f77b4" />
    <text x="304" y="180" class="bar-text">40.0%</text>

    <!-- Post Grad: 37.7% -> 140px -->
    <text x="140" y="220" class="tick" text-anchor="end">Post Graduate</text>
    <rect x="150" y="206" width="140" height="20" rx="3" fill="#1f77b4" />
    <text x="296" y="220" class="bar-text">37.7%</text>

    <text x="280" y="270" class="axis-label" text-anchor="middle">At-Risk Rate (%)</text>
  </g>

  <!-- PANEL B: Declared Disability (Top Right) -->
  <g transform="translate(480, 70)">
    <text x="30" y="15" class="sub-title">(b) Declared Disability Status</text>
    <line x1="80" y1="230" x2="330" y2="230" stroke="#9ca3af" />
    <line x1="80" y1="40" x2="80" y2="230" stroke="#9ca3af" />

    <!-- Baseline at 52.8% -> y = 230 - 52.8*2.5 = 98.0 -->
    <line x1="80" y1="98" x2="330" y2="98" class="ref-line" />
    <text x="335" y="101" font-family="Arial, sans-serif" font-size="9px" fill="#dc2626" font-weight="bold">52.8%</text>

    <!-- No Disability: 51.9% -> h = 130px -> y = 100 -->
    <rect x="120" y="100" width="70" height="130" rx="3" fill="#1f77b4" />
    <text x="155" y="90" class="bar-text" text-anchor="middle">51.9%</text>
    <text x="155" y="250" class="tick" text-anchor="middle">No Disability (N)</text>
    <text x="155" y="264" font-family="Arial, sans-serif" font-size="9.5px" fill="#6b7280" text-anchor="middle">(N = 29,429)</text>

    <!-- Declared Disability: 60.8% -> h = 152px -> y = 78 -->
    <rect x="230" y="78" width="70" height="152" rx="3" fill="#d62728" />
    <text x="265" y="68" class="bar-text" fill="#d62728" text-anchor="middle">60.8%</text>
    <text x="265" y="250" class="tick" text-anchor="middle">Disability (Y)</text>
    <text x="265" y="264" font-family="Arial, sans-serif" font-size="9.5px" fill="#6b7280" text-anchor="middle">(N = 3,164)</text>

    <text x="45" y="135" class="axis-label" transform="rotate(-90 45 135)" text-anchor="middle">At-Risk Rate (%)</text>
  </g>

  <!-- PANEL C: Age Category (Bottom Left) -->
  <g transform="translate(40, 370)">
    <text x="0" y="15" class="sub-title">(c) Age Category</text>
    <line x1="80" y1="230" x2="380" y2="230" stroke="#9ca3af" />
    <line x1="80" y1="40" x2="80" y2="230" stroke="#9ca3af" />

    <!-- Baseline at 52.8% -> y = 230 - 52.8*2.5 = 98 -->
    <line x1="80" y1="98" x2="380" y2="98" class="ref-line" />

    <!-- 0-35: 54.4% -> h = 136px -> y = 94 -->
    <rect x="120" y="94" width="60" height="136" rx="3" fill="#64748b" />
    <text x="150" y="84" class="bar-text" text-anchor="middle">54.4%</text>
    <text x="150" y="250" class="tick" text-anchor="middle">0–35</text>
    <text x="150" y="264" font-family="Arial, sans-serif" font-size="9px" fill="#6b7280" text-anchor="middle">(70.4% cohort)</text>

    <!-- 35-55: 48.9% -> h = 122px -> y = 108 -->
    <rect x="210" y="108" width="60" height="122" rx="3" fill="#64748b" />
    <text x="240" y="98" class="bar-text" text-anchor="middle">48.9%</text>
    <text x="240" y="250" class="tick" text-anchor="middle">35–55</text>
    <text x="240" y="264" font-family="Arial, sans-serif" font-size="9px" fill="#6b7280" text-anchor="middle">(27.2% cohort)</text>

    <!-- 55<=: 49.8% -> h = 124px -> y = 106 -->
    <rect x="300" y="106" width="60" height="124" rx="3" fill="#64748b" />
    <text x="330" y="96" class="bar-text" text-anchor="middle">49.8%</text>
    <text x="330" y="250" class="tick" text-anchor="middle">55 &lt;=</text>
    <text x="330" y="264" font-family="Arial, sans-serif" font-size="9px" fill="#6b7280" text-anchor="middle">(2.4% cohort)</text>

    <text x="45" y="135" class="axis-label" transform="rotate(-90 45 135)" text-anchor="middle">At-Risk Rate (%)</text>
  </g>

  <!-- PANEL D: Gender (Bottom Right) -->
  <g transform="translate(480, 370)">
    <text x="30" y="15" class="sub-title">(d) Gender</text>
    <line x1="80" y1="230" x2="330" y2="230" stroke="#9ca3af" />
    <line x1="80" y1="40" x2="80" y2="230" stroke="#9ca3af" />

    <!-- Baseline at 52.8% -> y = 98 -->
    <line x1="80" y1="98" x2="330" y2="98" class="ref-line" />

    <!-- Male: 53.6% -> h = 134px -> y = 96 -->
    <rect x="120" y="96" width="70" height="134" rx="3" fill="#1f77b4" />
    <text x="155" y="86" class="bar-text" text-anchor="middle">53.6%</text>
    <text x="155" y="250" class="tick" text-anchor="middle">Male (M)</text>
    <text x="155" y="264" font-family="Arial, sans-serif" font-size="9.5px" fill="#6b7280" text-anchor="middle">(N = 17,875)</text>

    <!-- Female: 51.8% -> h = 129px -> y = 101 -->
    <rect x="230" y="101" width="70" height="129" rx="3" fill="#ff7f0e" />
    <text x="265" y="91" class="bar-text" text-anchor="middle">51.8%</text>
    <text x="265" y="250" class="tick" text-anchor="middle">Female (F)</text>
    <text x="265" y="264" font-family="Arial, sans-serif" font-size="9.5px" fill="#6b7280" text-anchor="middle">(N = 14,718)</text>

    <text x="45" y="135" class="axis-label" transform="rotate(-90 45 135)" text-anchor="middle">At-Risk Rate (%)</text>
  </g>
</svg>
