<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .axis-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #374151; }
      .tick { font-family: Arial, sans-serif; font-size: 11px; fill: #4b5563; }
      .legend-text { font-family: Arial, sans-serif; font-size: 11px; fill: #1f2937; }
      .grid { stroke: #e5e7eb; stroke-dasharray: 3,3; }
    </style>
  </defs>
  <rect width="750" height="450" fill="#ffffff" />
  <text x="375" y="32" class="title">Figure 6: Density Distribution of Early Assessment Scores (Day ≤ 30)</text>
  <text x="375" y="50" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle">Evaluated strictly for students with submissions (Successful: N = 10,862 | At-Risk: N = 5,984)</text>

  <!-- Legend -->
  <line x1="120" y1="75" x2="145" y2="75" stroke="#1f77b4" stroke-width="2.5" />
  <text x="152" y="79" class="legend-text"><tspan font-weight="bold">Successful (0)</tspan>: Mean = 75.8% (Median = 78.0%)</text>
  <line x1="420" y1="75" x2="445" y2="75" stroke="#d62728" stroke-width="2.5" />
  <text x="452" y="79" class="legend-text"><tspan font-weight="bold">At-Risk (1)</tspan>: Mean = 58.2% (Median = 62.0%)</text>

  <!-- Axes & Grid -->
  <line x1="70" y1="360" x2="680" y2="360" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="70" y1="100" x2="70" y2="360" stroke="#9ca3af" stroke-width="1.2" />

  <!-- X ticks: 0 to 100, span: 600px -> 6px per score unit -->
  <!-- 0: 70, 20: 190, 40: 310, 60: 430, 80: 550, 100: 670 -->
  <text x="70" y="380" class="tick" text-anchor="middle">0%</text>
  <text x="190" y="380" class="tick" text-anchor="middle">20%</text>
  <text x="310" y="380" class="tick" text-anchor="middle">40%</text>
  <text x="430" y="380" class="tick" text-anchor="middle">60%</text>
  <text x="550" y="380" class="tick" text-anchor="middle">80%</text>
  <text x="670" y="380" class="tick" text-anchor="middle">100%</text>
  <text x="370" y="415" class="axis-label" text-anchor="middle">Early Assessment Average Score (Day ≤ 30, %)</text>

  <!-- Pass Threshold at 40% (x = 310) -->
  <line x1="310" y1="100" x2="310" y2="360" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="315" y="125" font-family="Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#4b5563">Pass Benchmark (40%)</text>

  <!-- Smooth Density Curve 1: At-Risk Group (Peak ~62%, high left tail) -->
  <path d="M 70 355 C 130 350, 190 320, 250 280 C 310 240, 370 190, 430 180 C 490 200, 550 260, 610 320 C 640 345, 660 355, 670 358" 
        fill="none" stroke="#d62728" stroke-width="2.5" />
  <path d="M 70 355 C 130 350, 190 320, 250 280 C 310 240, 370 190, 430 180 C 490 200, 550 260, 610 320 C 640 345, 660 355, 670 358 L 670 360 L 70 360 Z" 
        fill="#d62728" fill-opacity="0.12" />

  <!-- Smooth Density Curve 2: Successful Group (Strong peak at ~78-85%, low tail) -->
  <path d="M 70 359 C 130 358, 190 355, 250 345 C 310 330, 370 290, 430 220 C 490 140, 550 110, 610 180 C 640 250, 660 330, 670 355" 
        fill="none" stroke="#1f77b4" stroke-width="2.5" />
  <path d="M 70 359 C 130 358, 190 355, 250 345 C 310 330, 370 290, 430 220 C 490 140, 550 110, 610 180 C 640 250, 660 330, 670 355 L 670 360 L 70 360 Z" 
        fill="#1f77b4" fill-opacity="0.15" />

  <text x="25" y="230" class="axis-label" transform="rotate(-90 25 230)" text-anchor="middle">Kernel Density Estimate</text>
</svg>
