<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .axis-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #374151; }
      .tick { font-family: Arial, sans-serif; font-size: 11px; fill: #4b5563; }
      .seg-text-white { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .seg-text-dark { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .grid { stroke: #e5e7eb; stroke-dasharray: 3,3; }
    </style>
  </defs>
  <rect width="650" height="450" fill="#ffffff" />
  <text x="325" y="32" class="title">Figure 5: Early Assessment Participation by Final Outcome</text>
  <text x="325" y="50" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle">(Prediction Cutoff: Day ≤ 30 | N = 32,593)</text>

  <!-- Legend -->
  <rect x="130" y="70" width="16" height="12" fill="#1f77b4" />
  <text x="152" y="80" class="tick">Submitted ≥ 1 Assessment (Day ≤ 30)</text>
  <rect x="380" y="70" width="16" height="12" fill="#e2e8f0" stroke="#94a3b8" />
  <text x="402" y="80" class="tick">No Submission by Day 30</text>

  <!-- Grid lines -->
  <line x1="80" y1="360" x2="580" y2="360" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="80" y1="300" x2="580" y2="300" class="grid" />
  <line x1="80" y1="240" x2="580" y2="240" class="grid" />
  <line x1="80" y1="180" x2="580" y2="180" class="grid" />
  <line x1="80" y1="120" x2="580" y2="120" class="grid" />

  <!-- Y Ticks (0% to 100%, 240px span -> 2.4px per 1%) -->
  <text x="70" y="364" class="tick" text-anchor="end">0%</text>
  <text x="70" y="304" class="tick" text-anchor="end">25%</text>
  <text x="70" y="244" class="tick" text-anchor="end">50%</text>
  <text x="70" y="184" class="tick" text-anchor="end">75%</text>
  <text x="70" y="124" class="tick" text-anchor="end">100%</text>
  <text x="25" y="240" class="axis-label" transform="rotate(-90 25 240)" text-anchor="middle">Proportion of Student Group (%)</text>

  <!-- Stacked Bar 1: Successful Group (70.6% submitted, 29.4% unsubmitted) -->
  <!-- 70.6% -> height = 70.6 * 2.4 = 169.4px -> y = 360 - 169.4 = 190.6 -->
  <rect x="170" y="191" width="120" height="169" rx="3" fill="#1f77b4" />
  <text x="230" y="275" class="seg-text-white">70.6%</text>
  <text x="230" y="290" font-family="Arial, sans-serif" font-size="10px" fill="#dbeafe" text-anchor="middle">(10,862)</text>

  <!-- Unsubmitted: 29.4% -> height = 29.4 * 2.4 = 70.6px -> y = 190.6 - 70.6 = 120 -->
  <rect x="170" y="120" width="120" height="71" rx="3" fill="#e2e8f0" stroke="#cbd5e1" />
  <text x="230" y="152" class="seg-text-dark">29.4%</text>
  <text x="230" y="166" font-family="Arial, sans-serif" font-size="10px" fill="#475569" text-anchor="middle">(4,523)</text>
  
  <text x="230" y="382" class="tick" font-weight="bold" text-anchor="middle">Successful Group (0)</text>
  <text x="230" y="396" font-family="Arial, sans-serif" font-size="10px" fill="#6b7280" text-anchor="middle">(N = 15,385)</text>

  <!-- Stacked Bar 2: At-Risk Group (34.8% submitted, 65.2% unsubmitted) -->
  <!-- 34.8% -> height = 34.8 * 2.4 = 83.5px -> y = 360 - 83.5 = 276.5 -->
  <rect x="370" y="276" width="120" height="84" rx="3" fill="#1f77b4" />
  <text x="430" y="320" class="seg-text-white">34.8%</text>
  <text x="430" y="335" font-family="Arial, sans-serif" font-size="10px" fill="#dbeafe" text-anchor="middle">(5,984)</text>

  <!-- Unsubmitted: 65.2% -> height = 65.2 * 2.4 = 156.5px -> y = 276.5 - 156.5 = 120 -->
  <rect x="370" y="120" width="120" height="156" rx="3" fill="#e2e8f0" stroke="#cbd5e1" />
  <text x="430" y="195" class="seg-text-dark">65.2%</text>
  <text x="430" y="210" font-family="Arial, sans-serif" font-size="10px" fill="#475569" text-anchor="middle">(11,224)</text>

  <text x="430" y="382" class="tick" font-weight="bold" text-anchor="middle">At-Risk Group (1)</text>
  <text x="430" y="396" font-family="Arial, sans-serif" font-size="10px" fill="#6b7280" text-anchor="middle">(N = 17,208)</text>
</svg>
