<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
<defs>
<style>
  .title { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
  .subtitle { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
  .axis { stroke: #94a3b8; stroke-width: 1.5; }
  .grid { stroke: #f1f5f9; stroke-width: 1; stroke-dasharray: 4,4; }
  .tick-text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #1e293b; text-anchor: middle; font-weight: bold; }
  .tick-sub { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
  .tick-text-y { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: end; }
  .axis-label { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
  .bar-label { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
  .gain-text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
  .legend-text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #1e293b; font-weight: 500; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
</marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
</marker>
</defs>
<rect width="900" height="520" fill="#ffffff" />
<text x="90" y="32" class="title">Figure 28: Incremental Scenario Progression Across Random Partitions</text>
<text x="90" y="52" class="subtitle">Mean Out-of-Sample ROC-AUC and Individual Partition Trajectories (S0 → S1 → S2 Across 5 Random Seeds)</text>

<!-- Grid & Y-Ticks (0.55 to 0.90, plot_h = 375, margin_t = 70, margin_b = 75 -> y = 70 to 445) -->
<!-- y_map(val) = 70 + 375 - ((val - 0.55) / (0.90 - 0.55)) * 375 -->
<line x1="90" y1="445.0" x2="840" y2="445.0" class="grid" />
<text x="78" y="449.0" class="tick-text-y">0.55</text>
<line x1="90" y1="391.4" x2="840" y2="391.4" class="grid" />
<text x="78" y="395.4" class="tick-text-y">0.60</text>
<line x1="90" y1="337.9" x2="840" y2="337.9" class="grid" />
<text x="78" y="341.9" class="tick-text-y">0.65</text>
<line x1="90" y1="284.3" x2="840" y2="284.3" class="grid" />
<text x="78" y="288.3" class="tick-text-y">0.70</text>
<line x1="90" y1="230.7" x2="840" y2="230.7" class="grid" />
<text x="78" y="234.7" class="tick-text-y">0.75</text>
<line x1="90" y1="177.1" x2="840" y2="177.1" class="grid" />
<text x="78" y="181.1" class="tick-text-y">0.80</text>
<line x1="90" y1="123.6" x2="840" y2="123.6" class="grid" />
<text x="78" y="127.6" class="tick-text-y">0.85</text>
<line x1="90" y1="70.0" x2="840" y2="70.0" class="grid" />
<text x="78" y="74.0" class="tick-text-y">0.90</text>

<!-- Scenario Centers: plot_w = 750 / 3 = 250 each. Centers: S0 = 215, S1 = 465, S2 = 715 -->
<!-- Individual Seed Trajectories (Faint dashed lines) -->
<!-- Seed 7: S0=0.6158 (y=374.5), S1=0.7554 (y=224.9), S2=0.8388 (y=135.6) -->
<polyline points="215,374.5 465,224.9 715,135.6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />
<!-- Seed 21: S0=0.6234 (y=366.4), S1=0.7618 (y=218.1), S2=0.8421 (y=132.0) -->
<polyline points="215,366.4 465,218.1 715,132.0" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />
<!-- Seed 42: S0=0.6195 (y=370.5), S1=0.7588 (y=221.3), S2=0.8406 (y=133.6) -->
<polyline points="215,370.5 465,221.3 715,133.6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />
<!-- Seed 84: S0=0.6169 (y=373.3), S1=0.7562 (y=224.1), S2=0.8395 (y=134.8) -->
<polyline points="215,373.3 465,224.1 715,134.8" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />
<!-- Seed 123: S0=0.6204 (y=369.6), S1=0.7599 (y=220.1), S2=0.8415 (y=132.7) -->
<polyline points="215,369.6 465,220.1 715,132.7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />

<!-- Scenario Bars -->
<!-- S0 Bar: Mean ROC-AUC = 0.6192 -> y = 370.9, height = 445 - 370.9 = 74.1 -->
<rect x="155" y="370.9" width="120" height="74.1" fill="#64748b" rx="4" />
<text x="215" y="358" class="bar-label">0.6192</text>
<!-- Error Bar S0: std = 0.0030 -> +/- 3.2px -->
<line x1="215" y1="367.7" x2="215" y2="374.1" stroke="#0f172a" stroke-width="2" />
<line x1="205" y1="367.7" x2="225" y2="367.7" stroke="#0f172a" stroke-width="2" />
<line x1="205" y1="374.1" x2="225" y2="374.1" stroke="#0f172a" stroke-width="2" />

<!-- S1 Bar: Mean ROC-AUC = 0.7584 -> y = 221.7, height = 445 - 221.7 = 223.3 -->
<rect x="405" y="221.7" width="120" height="223.3" fill="#0284c7" rx="4" />
<text x="465" y="208" class="bar-label">0.7584</text>
<!-- Error Bar S1: std = 0.0026 -> +/- 2.8px -->
<line x1="465" y1="218.9" x2="465" y2="224.5" stroke="#0f172a" stroke-width="2" />
<line x1="455" y1="218.9" x2="475" y2="218.9" stroke="#0f172a" stroke-width="2" />
<line x1="455" y1="224.5" x2="475" y2="224.5" stroke="#0f172a" stroke-width="2" />

<!-- S2 Bar: Mean ROC-AUC = 0.8405 -> y = 133.8, height = 445 - 133.8 = 311.2 -->
<rect x="655" y="133.8" width="120" height="311.2" fill="#0d9488" rx="4" />
<text x="715" y="120" class="bar-label">0.8405</text>
<!-- Error Bar S2: std = 0.0013 -> +/- 1.4px -->
<line x1="715" y1="132.4" x2="715" y2="135.2" stroke="#0f172a" stroke-width="2" />
<line x1="705" y1="132.4" x2="725" y2="132.4" stroke="#0f172a" stroke-width="2" />
<line x1="705" y1="135.2" x2="725" y2="135.2" stroke="#0f172a" stroke-width="2" />

<!-- X-Labels -->
<text x="215" y="468" class="tick-text">Scenario S0</text>
<text x="215" y="484" class="tick-sub">Baseline Demographics (12 raw / 48 feat)</text>

<text x="465" y="468" class="tick-text">Scenario S1</text>
<text x="465" y="484" class="tick-sub">+ Early Assessment Day ≤ 30 (20 raw / 58 feat)</text>

<text x="715" y="468" class="tick-text">Scenario S2</text>
<text x="715" y="484" class="tick-sub">+ Early VLE Day ≤ 30 (29 raw / 68 feat)</text>

<!-- Incremental Gain Arrows -->
<!-- S0 to S1 -->
<path d="M 285 240 L 395 240" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
<rect x="305" y="218" width="70" height="20" fill="#ffffff" fill-opacity="0.9" rx="3" />
<text x="340" y="233" class="gain-text" fill="#0284c7">+0.1392 AUC</text>

<!-- S1 to S2 -->
<path d="M 535 150 L 645 150" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)" />
<rect x="555" y="128" width="70" height="20" fill="#ffffff" fill-opacity="0.9" rx="3" />
<text x="590" y="143" class="gain-text" fill="#0d9488">+0.0821 AUC</text>

<!-- Cumulative Bracket S0 to S2 -->
<path d="M 215 330 L 215 90 L 715 90 L 715 105" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,3" />
<rect x="400" y="80" width="130" height="20" fill="#ffffff" rx="4" stroke="#cbd5e1" />
<text x="465" y="94" class="gain-text" fill="#1e293b">Total Gain: +0.2213 AUC</text>

<!-- Axes -->
<line x1="90" y1="445" x2="840" y2="445" class="axis" />
<line x1="90" y1="70" x2="90" y2="445" class="axis" />
<text x="465" y="508" text-anchor="middle" class="axis-label">Nested Information Scenario Progression</text>
<text x="24" y="257" text-anchor="middle" class="axis-label" transform="rotate(-90 24 257)">Mean Out-of-Sample ROC-AUC</text>
</svg>
