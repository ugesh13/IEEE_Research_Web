<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #111827; text-anchor: middle; }
      .axis-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #374151; }
      .tick { font-family: Arial, sans-serif; font-size: 11px; fill: #4b5563; }
      .legend-text { font-family: Arial, sans-serif; font-size: 11px; fill: #1f2937; }
      .grid { stroke: #e5e7eb; stroke-dasharray: 3,3; }
      .bar-text { font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>
  <rect width="700" height="450" fill="#ffffff" />
  <text x="350" y="32" class="title">Figure 8: Active Learning Days Distribution by Target Group</text>
  <text x="350" y="50" font-family="Arial, sans-serif" font-size="11px" fill="#6b7280" text-anchor="middle">Proportion of group active across day ranges (Day ≤ 30 | N = 32,593)</text>

  <!-- Legend -->
  <rect x="220" y="70" width="16" height="12" fill="#1f77b4" />
  <text x="242" y="80" class="legend-text">Successful Group (0)</text>
  <rect x="420" y="70" width="16" height="12" fill="#d62728" />
  <text x="442" y="80" class="legend-text">At-Risk Group (1)</text>

  <!-- Grid lines -->
  <line x1="70" y1="360" x2="650" y2="360" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="70" y1="300" x2="650" y2="300" class="grid" />
  <line x1="70" y1="240" x2="650" y2="240" class="grid" />
  <line x1="70" y1="180" x2="650" y2="180" class="grid" />
  <line x1="70" y1="120" x2="650" y2="120" class="grid" />

  <!-- Y Ticks (0 to 35%, span: 240px -> 6.86px per 1%) -->
  <text x="60" y="364" class="tick" text-anchor="end">0%</text>
  <text x="60" y="304" class="tick" text-anchor="end">10%</text>
  <text x="60" y="244" class="tick" text-anchor="end">20%</text>
  <text x="60" y="184" class="tick" text-anchor="end">30%</text>
  <text x="60" y="124" class="tick" text-anchor="end">40%</text>
  <text x="25" y="240" class="axis-label" transform="rotate(-90 25 240)" text-anchor="middle">Group Proportion (%)</text>

  <!-- Categories: 0 days, 1-3 days, 4-7 days, 8-14 days, 15+ days -->
  <!-- 1. 0 days: Succ 9.4%, Risk 29.8% -->
  <rect x="100" y="295" width="40" height="65" fill="#1f77b4" rx="2" />
  <text x="120" y="288" class="bar-text" fill="#1f77b4">9.4%</text>
  <rect x="145" y="155" width="40" height="205" fill="#d62728" rx="2" />
  <text x="165" y="148" class="bar-text" fill="#d62728">29.8%</text>
  <text x="142" y="380" class="tick" text-anchor="middle">0 days</text>
  <text x="142" y="394" font-family="Arial, sans-serif" font-size="9.5px" fill="#6b7280" text-anchor="middle">(No clicks)</text>

  <!-- 2. 1-3 days: Succ 12.2%, Risk 25.4% -->
  <rect x="210" y="276" width="40" height="84" fill="#1f77b4" rx="2" />
  <text x="230" y="269" class="bar-text" fill="#1f77b4">12.2%</text>
  <rect x="255" y="186" width="40" height="174" fill="#d62728" rx="2" />
  <text x="275" y="179" class="bar-text" fill="#d62728">25.4%</text>
  <text x="252" y="380" class="tick" text-anchor="middle">1–3 days</text>

  <!-- 3. 4-7 days: Succ 18.5%, Risk 19.2% -->
  <rect x="320" y="233" width="40" height="127" fill="#1f77b4" rx="2" />
  <text x="340" y="226" class="bar-text" fill="#1f77b4">18.5%</text>
  <rect x="365" y="228" width="40" height="132" fill="#d62728" rx="2" />
  <text x="385" y="221" class="bar-text" fill="#d62728">19.2%</text>
  <text x="362" y="380" class="tick" text-anchor="middle">4–7 days</text>

  <!-- 4. 8-14 days: Succ 29.1%, Risk 15.6% -->
  <rect x="430" y="160" width="40" height="200" fill="#1f77b4" rx="2" />
  <text x="450" y="153" class="bar-text" fill="#1f77b4">29.1%</text>
  <rect x="475" y="253" width="40" height="107" fill="#d62728" rx="2" />
  <text x="495" y="246" class="bar-text" fill="#d62728">15.6%</text>
  <text x="472" y="380" class="tick" text-anchor="middle">8–14 days</text>

  <!-- 5. 15+ days: Succ 30.8%, Risk 10.0% -->
  <rect x="540" y="149" width="40" height="211" fill="#1f77b4" rx="2" />
  <text x="560" y="142" class="bar-text" fill="#1f77b4">30.8%</text>
  <rect x="585" y="291" width="40" height="69" fill="#d62728" rx="2" />
  <text x="605" y="284" class="bar-text" fill="#d62728">10.0%</text>
  <text x="582" y="380" class="tick" text-anchor="middle">15+ days</text>
</svg>
